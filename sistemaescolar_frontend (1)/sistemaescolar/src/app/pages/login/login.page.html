<ion-content class="ion-padding" color="light">
  <div class="login-container">
    <ion-card class="login-card">
      <ion-card-header>
        <img src="assets/icon/logo.png" alt="Logo institucional" class="login-logo" />
        <ion-card-title class="ion-text-center">Complejo Educativo</ion-card-title>
        <ion-card-title class="ion-text-center titulo-institucion">Cantón El Zunzal</ion-card-title>
        <ion-card-subtitle class="ion-text-center">Iniciar Sesión</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="onLogin()">
          <ion-item class="ion-margin-bottom">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input 
              type="text" 
              label="Usuario" 
              labelPlacement="floating" 
              [(ngModel)]="credenciales.usuario" 
              name="usuario" 
              required>
            </ion-input>
          </ion-item>

          <ion-item class="ion-margin-bottom">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input 
              type="password" 
              label="Contraseña" 
              labelPlacement="floating" 
              [(ngModel)]="credenciales.password" 
              name="password" 
              required>
            </ion-input>
          </ion-item>

          <ion-button expand="block" type="submit" color="primary" class="ion-margin-top">
            Entrar
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
