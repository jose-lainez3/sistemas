<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Cursos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ng-container *ngIf="!mostrarFormulario">

    <div *ngIf="cargando" class="ion-text-center ion-padding" style="margin-top: 50px;">
      <ion-label color="medium">Cargando cursos...</ion-label>
    </div>

    <div *ngIf="errorCarga && !cargando" class="ion-text-center ion-padding" style="margin-top: 50px;">
      <ion-icon name="alert-circle-outline" style="font-size: 60px; color: #e74c3c;"></ion-icon>
      <br><ion-label color="danger">{{ errorCarga }}</ion-label><br><br>
      <ion-button (click)="cargarCursos()">Reintentar</ion-button>
    </div>

    <div *ngIf="!cargando && !errorCarga && cursos.length === 0" class="ion-text-center ion-padding" style="margin-top: 50px;">
      <ion-icon name="school-outline" style="font-size: 80px; color: #ccc;"></ion-icon>
      <br>
      <ion-label color="medium">No hay cursos registrados todavía.</ion-label>
    </div>

    <ion-list *ngIf="!cargando && cursos.length > 0">
      <ion-item *ngFor="let curso of cursos">
        <ion-label>
          <h2><strong>{{ curso.nombre }}</strong></h2>
          <p>Año lectivo: {{ curso.anio_lectivo }}</p>
        </ion-label>
        <ion-button fill="clear" color="danger" slot="end" (click)="eliminarCurso(curso)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button color="success" (click)="abrirFormulario()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>

  </ng-container>

  <ng-container *ngIf="mostrarFormulario">
    <ion-card>
      <ion-card-header><ion-card-title>Nuevo Curso</ion-card-title></ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Nombre del curso</ion-label>
          <ion-input [(ngModel)]="nuevoCurso.nombre" placeholder="Ej: Matemáticas 1°"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Año lectivo</ion-label>
          <ion-input type="number" [(ngModel)]="nuevoCurso.anio_lectivo"></ion-input>
        </ion-item>
      </ion-card-content>
    </ion-card>
    <div class="ion-padding">
      <ion-button expand="block" color="success" (click)="guardarCurso()">
        <ion-icon name="save" slot="start"></ion-icon> Guardar
      </ion-button>
      <ion-button expand="block" fill="outline" color="medium" (click)="cancelar()">
        <ion-icon name="close" slot="start"></ion-icon> Cancelar
      </ion-button>
    </div>
  </ng-container>

</ion-content>
