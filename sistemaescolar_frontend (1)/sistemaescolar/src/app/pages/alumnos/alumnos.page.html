<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Gestión de Alumnos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- ================= VISTA LISTA ================= -->
  <ng-container *ngIf="!mostrarFormulario">

    <!-- Buscador -->
    <ion-searchbar
      *ngIf="!cargando && alumnos.length > 0"
      placeholder="Buscar alumno..."
      (ionInput)="filtrarAlumnos($event)">
    </ion-searchbar>

    <!-- 1. Pantalla de carga -->
    <div *ngIf="cargando" class="ion-text-center ion-padding" style="margin-top: 50px;">
      <ion-label color="medium">Cargando base de datos...</ion-label>
    </div>

    <!-- 2. Mensaje si la base de datos está vacía -->
    <div *ngIf="!cargando && alumnos.length === 0" class="ion-text-center ion-padding" style="margin-top: 50px;">
      <ion-icon name="people-circle-outline" style="font-size: 80px; color: #ccc;"></ion-icon>
      <br>
      <ion-label color="medium">No hay alumnos registrados todavía.</ion-label>
    </div>

    <!-- 3. La lista de alumnos -->
    <ion-list *ngIf="!cargando && alumnos.length > 0">
      <ion-item *ngFor="let alumno of alumnosFiltrados">
        <ion-avatar slot="start">
          <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Avatar" />
        </ion-avatar>
        <ion-label>
          <h2><strong>{{ alumno.nombres }} {{ alumno.apellidos }}</strong></h2>
          <p>DNI: {{ alumno.dni || 'N/A' }} | Tel: {{ alumno.telefono || 'N/A' }}</p>
        </ion-label>

        <ion-button fill="clear" color="danger" slot="end" (click)="eliminarAlumno(alumno)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <!-- 4. Botón flotante para agregar un nuevo alumno -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button color="success" (click)="abrirFormulario()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>

  </ng-container>

  <!-- ================= VISTA FORMULARIO ================= -->
  <ng-container *ngIf="mostrarFormulario">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Nuevo Alumno</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Nombres</ion-label>
          <ion-input [(ngModel)]="nuevoAlumno.nombres" placeholder="Ej: Juan Carlos"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Apellidos</ion-label>
          <ion-input [(ngModel)]="nuevoAlumno.apellidos" placeholder="Ej: Pérez Gómez"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">DNI</ion-label>
          <ion-input [(ngModel)]="nuevoAlumno.dni" placeholder="Ej: 12345678"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Teléfono</ion-label>
          <ion-input [(ngModel)]="nuevoAlumno.telefono" placeholder="Ej: 987654321"></ion-input>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <div class="ion-padding">
      <ion-button expand="block" color="success" (click)="guardarAlumno()">
        <ion-icon name="save" slot="start"></ion-icon>
        Guardar
      </ion-button>
      <ion-button expand="block" fill="outline" color="medium" (click)="cancelar()">
        <ion-icon name="close" slot="start"></ion-icon>
        Cancelar
      </ion-button>
    </div>
  </ng-container>

</ion-content>
